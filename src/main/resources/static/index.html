<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upwork Job Analyzer</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1f2937; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.subtitle { color: #6b7280; margin-top: 0; }
  textarea { width: 100%; height: 340px; font-family: 'Menlo', 'Consolas', monospace; font-size: 13px; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; }
  .buttons { margin-top: 14px; }
  button { padding: 10px 22px; margin-right: 10px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 1px solid #d1d5db; background: #f3f4f6; }
  #evaluateBtn { background: #2563eb; color: #fff; border: none; }
  #evaluateBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #clearBtn { background: #fff; }
  #result { margin-top: 26px; line-height: 1.6; }
  .decision-yes { color: #15803d; font-weight: bold; font-size: 16px; }
  .decision-no { color: #b91c1c; font-weight: bold; font-size: 16px; }
  .section-title { font-weight: bold; margin-top: 20px; margin-bottom: 6px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
  .cover-letter { white-space: pre-wrap; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 14px; }
  .loading, .error { font-style: italic; }
  .error { color: #b91c1c; }
  .loading { color: #6b7280; }
</style>
</head>
<body>
<h1>Upwork Job Analyzer &amp; Cover Letter Writer</h1>
<p class="subtitle">Paste the full raw text of an Upwork job posting page (job details + "About the client" section) below, then click Evaluate.</p>

<div class="buttons">
  <button id="evaluateBtn">Evaluate</button>
  <button id="clearBtn">Clear</button>
</div>

<div id="result"></div>

<script>
const evaluateBtn = document.getElementById('evaluateBtn');
const clearBtn = document.getElementById('clearBtn');
const jobText = document.getElementById('jobText');
const result = document.getElementById('result');

clearBtn.addEventListener('click', () => {
  jobText.value = '';
  result.innerHTML = '';
  jobText.focus();
});

evaluateBtn.addEventListener('click', async () => {
  const text = jobText.value.trim();
  if (!text) {
    result.innerHTML = '<p class="error">Please paste a job post first.</p>';
    return;
  }
  evaluateBtn.disabled = true;
  result.innerHTML = '<p class="loading">Analyzing job post... this may take a few seconds.</p>';
  try {
    const res = await fetch('/evaluate', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: text
    });
    const data = await res.json();
    if (!res.ok) {
      result.innerHTML = '<p class="error">Error: ' + escapeHtml(data.error || res.statusText) + '</p>';
      return;
    }
    renderResult(data);
  } catch (e) {
    result.innerHTML = '<p class="error">Request failed: ' + escapeHtml(e.message) + '</p>';
  } finally {
    evaluateBtn.disabled = false;
  }
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str == null ? '' : str;
  return div.innerHTML;
}

function renderResult(data) {
  let html = '';
  html += '<div class="' + (data.shouldApply ? 'decision-yes' : 'decision-no') + '">'
        + escapeHtml(data.summary) + '</div>';

  if (data.clientEvaluation && !data.clientEvaluation.passed) {
    html += '<div class="section-title">Client Evaluation &mdash; Failed</div>';
    html += '<div>' + escapeHtml(data.clientEvaluation.failedReasons.join('; ')) + '</div>';
  }

  if (data.capabilityMatch) {
    const cm = data.capabilityMatch;
    html += '<div class="section-title">Capability Match</div>';
    html += '<div>Score: ' + cm.score + '/10</div>';
    html += '<div>Matched: ' + escapeHtml(cm.matchedTechnologies.join(', ')) + '</div>';
    html += '<div>Missing: ' + escapeHtml(cm.missingTechnologies.join(', ')) + '</div>';
    html += '<div>Reasoning: ' + escapeHtml(cm.reasoning) + '</div>';
  }

  if (data.coverLetter) {
    html += '<div class="section-title">Cover Letter</div>';
    html += '<div class="cover-letter">' + escapeHtml(data.coverLetter) + '</div>';
  }

  result.innerHTML = html;
}
</script>
</body>
</html>
